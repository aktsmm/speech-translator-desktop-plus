name: .NET build and publish

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
    - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 #v6

    - name: Setup .NET
      uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 #v5
      with:
        dotnet-version: '10.0.x'

    - name: Get version
      id: version
      shell: pwsh
      run: |
        $props = [xml](Get-Content 'Directory.Build.props')
        $version = $props.Project.PropertyGroup.VersionPrefix
        if ([string]::IsNullOrWhiteSpace($version)) {
          throw 'VersionPrefix is not defined in Directory.Build.props.'
        }
        "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

    - name: Restore dependencies
      run: dotnet restore speech-translator.sln

    - name: Restore Desktop RID dependencies
      run: dotnet restore src/SpeechTranslatorDesktop/SpeechTranslatorDesktop.csproj -r win-x64

    - name: Build solution
      run: dotnet build speech-translator.sln --configuration Release --no-restore

    - name: Test solution
      run: dotnet test speech-translator.sln --configuration Release --no-build --verbosity normal

    - name: Publish Console
      run: dotnet publish src/SpeechTranslatorConsole/SpeechTranslatorConsole.csproj --configuration Release --no-build --output artifacts/publish/console

    - name: Publish Desktop
      run: dotnet publish src/SpeechTranslatorDesktop/SpeechTranslatorDesktop.csproj --configuration Release -r win-x64 --self-contained true --no-restore --output artifacts/publish/desktop-win-x64

    - name: Install vpk tool
      shell: pwsh
      run: |
        dotnet tool install --global vpk
        "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Build Velopack packages
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path artifacts/velopack -Force | Out-Null
        vpk pack -u SpeechTranslatorDesktopPlus -v ${{ steps.version.outputs.version }} -o artifacts/velopack -p artifacts/publish/desktop-win-x64 -f net10-x64-desktop

    - name: Package publish outputs
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path artifacts/release -Force | Out-Null
        Compress-Archive -Path artifacts/publish/console/* -DestinationPath "artifacts/release/SpeechTranslatorConsole-win-x64-${{ steps.version.outputs.version }}.zip" -Force
        Compress-Archive -Path artifacts/publish/desktop-win-x64/* -DestinationPath "artifacts/release/SpeechTranslatorDesktopPlus-win-x64.zip" -Force
        Copy-Item "artifacts/release/SpeechTranslatorDesktopPlus-win-x64.zip" "artifacts/release/SpeechTranslatorDesktopPlus-win-x64-${{ steps.version.outputs.version }}.zip" -Force
        Copy-Item artifacts/velopack/* artifacts/release/ -Force
        Get-ChildItem artifacts/release/*.zip |
          ForEach-Object { "{0}  {1}" -f (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant(), $_.Name } |
          Set-Content artifacts/release/SHA256SUMS.txt -Encoding ascii

    - name: Upload publish artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7
      with:
        name: publish-${{ steps.version.outputs.version }}
        path: artifacts/release/*

  release:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download publish artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8
      with:
        name: publish-${{ needs.build.outputs.version }}
        path: artifacts/release

    - name: Ensure release version is new
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        REPO="${{ github.repository }}"
        VERSION="${{ needs.build.outputs.version }}"
        TARGET_SHA="${{ github.sha }}"

        if gh api "repos/$REPO/releases/tags/$VERSION" > /dev/null 2>&1; then
          echo "Release $VERSION already exists. Refusing overwrite."
          exit 1
        else
          set +e
          RELEASE_ERR="$(gh api "repos/$REPO/releases/tags/$VERSION" 2>&1 >/dev/null)"
          RELEASE_CODE=$?
          set -e
          if [ "$RELEASE_CODE" -ne 1 ] || [[ "$RELEASE_ERR" != *"HTTP 404"* ]]; then
            echo "Failed to check existing release for $VERSION: $RELEASE_ERR"
            exit 1
          fi
        fi

        set +e
        TAG_JSON="$(gh api "repos/$REPO/git/ref/tags/$VERSION" 2>&1)"
        TAG_CODE=$?
        set -e
        if [ "$TAG_CODE" -eq 0 ]; then
          TAG_TYPE="$(echo "$TAG_JSON" | jq -r '.object.type')"
          TAG_SHA="$(echo "$TAG_JSON" | jq -r '.object.sha')"
          if [ "$TAG_TYPE" = "tag" ]; then
            TAG_SHA="$(gh api "repos/$REPO/git/tags/$TAG_SHA" --jq '.object.sha')"
          fi

          if [ "$TAG_SHA" != "$TARGET_SHA" ]; then
            echo "Tag $VERSION already points to $TAG_SHA (current commit: $TARGET_SHA). Refusing overwrite."
            exit 1
          fi
        elif [[ "$TAG_JSON" != *"HTTP 404"* ]]; then
          echo "Failed to check tag $VERSION: $TAG_JSON"
          exit 1
        fi

    - name: Create tag and release
      uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda #v3.0.0
      with:
        tag_name: ${{ needs.build.outputs.version }}
        name: ${{ needs.build.outputs.version }}
        generate_release_notes: true
        target_commitish: ${{ github.sha }}
        files: artifacts/release/*
